name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: og_test
          POSTGRES_USER: og_test
          POSTGRES_PASSWORD: og_test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      APP_ENV: development
      TELEGRAM_BOT_TOKEN: "0:test_token"
      ENCRYPTION_KEY: "test-encryption-key-32-chars-min-xx"
      DB_DRIVER: "sqlite+aiosqlite"
      SQLITE_PATH: ":memory:"
      SUPER_ADMIN_IDS: "123456789"
      DB_PASSWORD: "test_pass"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/ || true

      - name: Type check (mypy)
        run: mypy src/ || true

      - name: Security scan (bandit)
        run: bandit -r src/ -ll || true

      - name: Run tests
        run: pytest tests/unit tests/security -v --tb=short

      - name: Check for secrets in code
        run: |
          if grep -r "sk-\|AKIA\|password.*=.*['\"][^$]" src/ --include="*.py" | grep -v "test\|example\|placeholder"; then
            echo "⚠️  احتمال وجود secret در کد"
            exit 1
          fi
          echo "✅ secret یافت نشد"

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t open-generate:${{ github.sha }} .
          echo "✅ Image build موفق: ${{ github.sha }}"

      - name: Record commit SHA
        run: echo "DEPLOY_SHA=${{ github.sha }}" >> $GITHUB_ENV
